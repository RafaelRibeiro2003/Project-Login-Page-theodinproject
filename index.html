<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Login Page</title>
</head>
<body>
    <!--Screen Splash-->
    <div class="splash-screen">
        <img src="images/logo.svg" alt="Logo">
        <h1>Company</h1>
    </div>
    <!--Page Login-->
    <div class="container">
        <div class="header">
            <img src="images/logo.svg" alt="logo pagina" > 
            <h1>Company</h1>
        </div>
    <div class="div-login">
        <div class="box-login">
            <div class="box-welcome">

                <div class="welcome-content">
                    <h1>Welcome<br>to login</h1>
                    <p>Sign in to continue to your account.</p>
                </div>

                <div class="about-content">
                    <h2>Who We Are</h2>
                    <p>We are a company dedicated to creating simple and innovative solutions.</p>
                </div>

            </div>
            <div class="box-login-input">
                <h1>Login</h1>
                <form>
                    <div class="input-group">
                        <label for="username">Username</label>
                            <div class="input-box">
                                <img alt="icon user" src="images/icon-user.svg">
                                <input type="text" id="username" name="username" placeholder="Type your Username">
                            </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-box">
                            <img alt="icon user" src="images/icon-password.svg">
                            <input type="password" id="password" name="password" placeholder="Type your Password">
                        </div>
                        <p class="forgot_password">Forgot Password?</p>
                    </div>

                    <button type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
    
    </div>
</body>
</html>
